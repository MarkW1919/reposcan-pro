[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reposcan-pro"
version = "0.1.0"
description = "Field-grade, edge-first vehicle intelligence system scaffold for long-range and low-light LPR."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "onnxruntime>=1.24,<2.0",
    "pillow>=11.0,<12.0",
    "pyserial>=3.5,<4.0",
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0",
    "uvicorn>=0.35,<1.0",
]

[project.optional-dependencies]
dataset = [
    "fiftyone>=1.14,<2.0",
]
training = [
    "numpy>=1.26.4,<2",
    "opencv-python>=4.10,<4.12",
    "ultralytics>=8.3,<9.0",
]
openai-labeling = [
    "openai>=2.0,<3.0",
]
vlm-labeling = [
    "accelerate>=1.0,<2.0",
    "qwen-vl-utils>=0.0.8,<0.1",
    "transformers>=4.51,<5.0",
]
prebuilt-alpr = [
    "fast-alpr[onnx]>=0.4,<0.5",
]
review-ui = [
    "gradio>=5.0,<6.0",
]
dev = [
    "httpx>=0.28,<1.0",
    "onnx>=1.20,<2.0",
    "pytest>=8.0",
    "pytest-cov",
]
postgres = [
    "psycopg[binary]>=3.2,<4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "packages/contracts/src",
    "apps/api/src",
    "ml/training/src",
    "services/storage/src",
    "services/capture/src",
    "services/preprocessing/src",
    "services/inference/src",
    "services/tracking/src",
    "services/alerting/src",
    "services/sync/src",
]

[tool.setuptools]
py-modules = []

[tool.reposcan]
python_baseline = "3.11"
node_baseline = "24"
runtime_policy = "edge-first"
storage_policy = "local-first"
