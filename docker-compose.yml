name: reposcan-pro

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: reposcan-postgres
    environment:
      POSTGRES_DB: reposcan
      POSTGRES_USER: reposcan
      POSTGRES_PASSWORD: reposcan_local
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reposcan -d reposcan"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.2-alpine
    container_name: reposcan-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:

