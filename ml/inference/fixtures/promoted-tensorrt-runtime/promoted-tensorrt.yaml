stack_name: fixture-promoted-tensorrt-runtime
description: Template for a promoted TensorRT stack with external engine manifests
path_base: config_dir
vehicle_detector:
  name: yolov8n-vehicle-trt
  backend: tensorrt
  artifact_path: artifacts/yolov8n-vehicle.engine
  artifact_manifest_path: manifests/vehicle_detector.manifest.json
  input_width: 640
  input_height: 640
  normalization_mean:
  - 0.0
  - 0.0
  - 0.0
  normalization_std:
  - 1.0
  - 1.0
  - 1.0
  class_labels:
  - car
  - truck
  - bus
  - motorcycle
  - bicycle
  confidence_threshold: 0.4
  nms_iou_threshold: 0.5
plate_detector:
  name: yolov8n-plate-trt
  backend: tensorrt
  artifact_path: artifacts/yolov8n-plate.engine
  artifact_manifest_path: manifests/plate_detector.manifest.json
  input_width: 640
  input_height: 640
  normalization_mean:
  - 0.0
  - 0.0
  - 0.0
  normalization_std:
  - 1.0
  - 1.0
  - 1.0
  class_labels:
  - plate
  confidence_threshold: 0.5
  nms_iou_threshold: 0.45
ocr:
  name: lprnet-v1-trt
  backend: tensorrt
  artifact_path: artifacts/lprnet-v1.engine
  artifact_manifest_path: manifests/ocr.manifest.json
  input_width: 94
  input_height: 24
  charset: '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ '
  beam_width: 5
  confidence_threshold: 0.6
classifier:
  name: vehicle-attr-v1-trt
  backend: tensorrt
  artifact_path: artifacts/vehicle-attr-v1.engine
  artifact_manifest_path: manifests/classifier.manifest.json
  input_width: 224
  input_height: 224
  normalization_mean:
  - 0.485
  - 0.456
  - 0.406
  normalization_std:
  - 0.229
  - 0.224
  - 0.225
  color_labels:
  - white
  - black
  - silver
  - gray
  - blue
  - red
  - green
  - yellow
  - orange
  - brown
  - other
  make_labels:
  - toyota
  - honda
  - ford
  - chevrolet
  - bmw
  - mercedes
  - other
  enabled: true
