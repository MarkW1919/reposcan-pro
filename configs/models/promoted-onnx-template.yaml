# Example promoted ONNX stack template.
# Use this shape when registering real promoted artifacts outside git.

stack_name: promoted-onnx-template
description: "Template for a promoted ONNX stack with external artifact manifests"
path_base: config_dir

vehicle_detector:
  name: yolov8n-vehicle
  backend: onnx
  artifact_path: artifacts/models/promoted/example-bundle/yolov8n-vehicle.onnx
  artifact_manifest_path: artifacts/models/promoted/example-bundle/yolov8n-vehicle.manifest.json
  input_width: 640
  input_height: 640
  normalization_mean: [0.0, 0.0, 0.0]
  normalization_std: [1.0, 1.0, 1.0]
  class_labels: [car, truck, bus, motorcycle, bicycle]
  confidence_threshold: 0.4
  nms_iou_threshold: 0.5

plate_detector:
  name: yolov8n-plate
  backend: onnx
  artifact_path: artifacts/models/promoted/example-bundle/yolov8n-plate.onnx
  artifact_manifest_path: artifacts/models/promoted/example-bundle/yolov8n-plate.manifest.json
  input_width: 640
  input_height: 640
  normalization_mean: [0.0, 0.0, 0.0]
  normalization_std: [1.0, 1.0, 1.0]
  class_labels: [plate]
  confidence_threshold: 0.5
  nms_iou_threshold: 0.45

ocr:
  name: lprnet-v1
  backend: onnx
  artifact_path: artifacts/models/promoted/example-bundle/lprnet-v1.onnx
  artifact_manifest_path: artifacts/models/promoted/example-bundle/lprnet-v1.manifest.json
  input_width: 94
  input_height: 24
  charset: "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ "
  beam_width: 5
  confidence_threshold: 0.6

classifier:
  name: vehicle-attr-v1
  backend: onnx
  artifact_path: artifacts/models/promoted/example-bundle/vehicle-attr-v1.onnx
  artifact_manifest_path: artifacts/models/promoted/example-bundle/vehicle-attr-v1.manifest.json
  # Optional for metadata-backed single-task classifier exports.
  # label_metadata_path: artifacts/models/promoted/example-bundle/vehicle-attr-v1.labels.json
  input_width: 224
  input_height: 224
  normalization_mean: [0.485, 0.456, 0.406]
  normalization_std: [0.229, 0.224, 0.225]
  color_labels:
    - white
    - black
    - silver
    - gray
    - blue
    - red
    - green
    - yellow
    - orange
    - brown
    - other
  make_labels:
    - toyota
    - honda
    - ford
    - chevrolet
    - bmw
    - mercedes
    - other
  enabled: true
