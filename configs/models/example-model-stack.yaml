# Example model stack configuration.
# Validated by: reposcan_contracts.config.model.ModelStackConfig
#
# Artifact paths are relative to the repo root.
# Replace placeholder paths with real model artifacts before running inference.

stack_name: default-lpr-stack
description: "Default ONNX model stack for edge LPR deployment"
path_base: repo_root

vehicle_detector:
  name: yolov8n-vehicle
  backend: onnx
  artifact_path: artifacts/models/yolov8n-vehicle.onnx
  input_width: 640
  input_height: 640
  normalization_mean: [0.0, 0.0, 0.0]
  normalization_std: [1.0, 1.0, 1.0]
  class_labels: [car, truck, bus, motorcycle, bicycle]
  confidence_threshold: 0.4
  nms_iou_threshold: 0.5

plate_detector:
  name: yolov8n-plate
  backend: onnx
  artifact_path: artifacts/models/yolov8n-plate.onnx
  input_width: 640
  input_height: 640
  normalization_mean: [0.0, 0.0, 0.0]
  normalization_std: [1.0, 1.0, 1.0]
  class_labels: [plate]
  confidence_threshold: 0.5
  nms_iou_threshold: 0.45

ocr:
  name: lprnet-v1
  backend: onnx
  artifact_path: artifacts/models/lprnet-v1.onnx
  input_width: 94
  input_height: 24
  charset: "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ "
  beam_width: 5
  confidence_threshold: 0.6

classifier:
  name: vehicle-attr-v1
  backend: onnx
  artifact_path: artifacts/models/vehicle-attr-v1.onnx
  input_width: 224
  input_height: 224
  normalization_mean: [0.485, 0.456, 0.406]
  normalization_std: [0.229, 0.224, 0.225]
  color_labels:
    - white
    - black
    - silver
    - gray
    - blue
    - red
    - green
    - yellow
    - orange
    - brown
    - other
  make_labels:
    - toyota
    - honda
    - ford
    - chevrolet
    - bmw
    - mercedes
    - other
  enabled: true
