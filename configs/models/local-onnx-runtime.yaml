# Local ONNX runtime fixture stack.
# Validated by: reposcan_contracts.config.model.ModelStackConfig
#
# These committed fixture models prove real backend-loaded inference wiring.
# They are not promoted field models and should not be treated as accuracy-ready.

stack_name: local-onnx-runtime
description: "Tracked ONNX runtime fixture stack for no-hardware integration and demo validation"
path_base: repo_root

vehicle_detector:
  name: fixture-vehicle-detector
  backend: onnx
  artifact_path: ml/inference/fixtures/onnx-runtime/vehicle-detector.onnx
  input_width: 640
  input_height: 640
  normalization_mean: [0.0, 0.0, 0.0]
  normalization_std: [1.0, 1.0, 1.0]
  class_labels: [car]
  confidence_threshold: 0.4
  nms_iou_threshold: 0.5

plate_detector:
  name: fixture-plate-detector
  backend: onnx
  artifact_path: ml/inference/fixtures/onnx-runtime/plate-detector.onnx
  input_width: 320
  input_height: 160
  normalization_mean: [0.0, 0.0, 0.0]
  normalization_std: [1.0, 1.0, 1.0]
  class_labels: [plate]
  confidence_threshold: 0.5
  nms_iou_threshold: 0.45

ocr:
  name: fixture-ocr
  backend: onnx
  artifact_path: ml/inference/fixtures/onnx-runtime/ocr.onnx
  input_width: 144
  input_height: 48
  charset: "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ "
  beam_width: 1
  confidence_threshold: 0.6

classifier:
  name: fixture-vehicle-attributes
  backend: onnx
  artifact_path: ml/inference/fixtures/onnx-runtime/classifier.onnx
  input_width: 224
  input_height: 224
  normalization_mean: [0.485, 0.456, 0.406]
  normalization_std: [0.229, 0.224, 0.225]
  color_labels:
    - white
    - black
    - silver
    - gray
    - blue
    - red
    - green
    - yellow
    - orange
    - brown
    - other
  make_labels:
    - toyota
    - honda
    - ford
    - chevrolet
    - bmw
    - mercedes
    - other
  enabled: true
