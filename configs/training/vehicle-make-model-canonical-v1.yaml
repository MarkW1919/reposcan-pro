profile_name: vehicle-make-model-canonical-v1
task: vehicle_make_model_classification
framework: torchvision
output_root: runtime/training
allow_pending_review: true
dataset_adapter: imagefolder
base_model: efficientnet_b0
image_size: 260
epochs: 30
batch_size: 24
workers: 4
patience: 8
seed: 42
learning_rate: 0.0008
weight_decay: 0.0005
label_smoothing: 0.05
dropout: 0.3
freeze_backbone_epochs: 3
validation_fraction: 0.15
precision: fp32
device: auto
augmentation:
  horizontal_flip: true
  motion_blur: true
  defocus_blur: true
  brightness_contrast: true
  noise: true
  compression_artifacts: true
  perspective_distortion: true
  random_erasing: true
  mixup_alpha: 0.1
  synthetic_support_ratio: 0.0
  notes:
    - Path 2 of the post-VMMRdb integration plan; warm-start the EfficientNet-B0 backbone from the V3 polish checkpoint and reinitialize the classifier head for the canonical 20-class taxonomy.
    - Run with --initial-checkpoint <v3 best.pt> --initial-checkpoint-replace-head so backbone weights load while the head is reinitialized for the new class space.
    - Trains on the unioned VMMRdb + Wikimedia gmc_sierra gap + reviewed priority dataset (canonical-vehicle-make-model-20260505).
    - Freeze the backbone for the first 3 epochs to let the new head warm up before unfreezing the full model.
    - Higher LR than V3 polish because the head is randomly initialized; weight_decay and label_smoothing kept conservative for the smaller class count.
