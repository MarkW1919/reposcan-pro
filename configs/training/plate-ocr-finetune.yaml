profile_name: plate-ocr-finetune
task: plate_ocr
framework: paddleocr
output_root: runtime/training
allow_pending_review: false
dataset_adapter: manifest_split
base_model: en_PP-OCRv4_rec_train/best_accuracy
image_size: 320
epochs: 80
batch_size: 128
workers: 4
patience: 10
precision: fp16
device: auto
augmentation:
  motion_blur: true
  defocus_blur: true
  brightness_contrast: true
  noise: true
  compression_artifacts: true
  perspective_distortion: true
  synthetic_support_ratio: 0.2
  notes:
    - Synthetic OCR support data should stay supplemental to real plate crops.
