profile_name: vehicle-detector-open-images-gpu-warmstart
task: vehicle_detection
framework: ultralytics
output_root: runtime/training
allow_pending_review: true
dataset_adapter: manifest_split
base_model: yolo11s.pt
image_size: 640
epochs: 50
batch_size: 16
workers: 4
patience: 12
precision: fp16
device: auto
class_names:
  - vehicle
augmentation:
  motion_blur: true
  defocus_blur: true
  brightness_contrast: true
  noise: true
  compression_artifacts: true
  perspective_distortion: true
  synthetic_support_ratio: 0.0
  notes:
    - GPU warm-start profile for public Open Images vehicle detections.
    - Use only for detector baseline training; this is not a commercial Oklahoma release gate.
    - Promote to vehicle-detector-finetune.yaml once approved field-capture manifests are available.
