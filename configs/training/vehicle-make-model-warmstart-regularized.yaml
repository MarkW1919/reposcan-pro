profile_name: vehicle-make-model-warmstart-regularized
task: vehicle_make_model_classification
framework: torchvision
output_root: runtime/training
allow_pending_review: true
dataset_adapter: stanford_cars
base_model: efficientnet_b0
image_size: 224
epochs: 16
batch_size: 32
workers: 4
patience: 5
seed: 42
learning_rate: 0.0002
weight_decay: 0.0005
label_smoothing: 0.08
precision: fp32
device: auto
augmentation:
  horizontal_flip: true
  motion_blur: true
  defocus_blur: true
  brightness_contrast: true
  noise: true
  compression_artifacts: true
  perspective_distortion: true
  synthetic_support_ratio: 0.0
  notes:
    - Fine-tune from the current best warm-start checkpoint with stronger regularization.
    - Keep the Stanford Cars validation basis fixed so runs stay comparable to the 0.8120 baseline.
