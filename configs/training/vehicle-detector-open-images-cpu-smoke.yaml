profile_name: vehicle-detector-open-images-cpu-smoke
task: vehicle_detection
framework: ultralytics
output_root: runtime/training
allow_pending_review: true
dataset_adapter: manifest_split
base_model: yolo11n.pt
image_size: 320
epochs: 3
batch_size: 4
workers: 0
patience: 2
precision: fp32
device: cpu
class_names:
  - vehicle
use_amp: false
augmentation:
  motion_blur: true
  defocus_blur: true
  brightness_contrast: true
  noise: true
  compression_artifacts: true
  perspective_distortion: true
  synthetic_support_ratio: 0.0
  notes:
    - CPU smoke profile for validating Open Images vehicle-detection warm-start plumbing.
    - This is not a production-quality training profile.
