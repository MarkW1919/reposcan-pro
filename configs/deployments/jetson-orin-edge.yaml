# Jetson Orin edge deployment profile.
# Validated by: reposcan_contracts.config.deployment.DeploymentConfig
#
# Enables the optional sync service while keeping the local path authoritative.

deployment_name: jetson-orin-edge
description: "Jetson Orin edge deployment profile with optional upstream sync"

target_hardware: jetson_orin

enabled_services:
  capture: true
  preprocessing: true
  inference: true
  tracking: true
  storage: true
  alerting: true
  api: true
  ui: true
  sync: true

infrastructure:
  metadata_backend: postgres
  postgres_url: "postgresql://reposcan:reposcan@localhost:5432/reposcan"
  media_root: "./media"
  api_host: "0.0.0.0"
  api_port: 8000
  ui_port: 3000
  log_level: info

media_retention:
  frames_days: 5
  crops_days: 21
  snippets_days: 10
  exports_days: 45

storage_pressure:
  warning_free_space_gb: 8.0
  minimum_free_space_gb: 4.0

remote_sync:
  enabled: true
  endpoint_url: "http://127.0.0.1:8081/sync/detections"
  timeout_seconds: 5.0

alert_delivery:
  enabled: true
  webhook_url: "http://127.0.0.1:8081/alerts/webhook"
  timeout_seconds: 5.0

performance:
  inference_batch_size: 2
  max_worker_threads: 6
  frame_queue_depth: 16
  enable_profiling: true

runtime:
  required_backend: tensorrt
  target_runtime: tensorrt
  required_path_base: config_dir
  required_cuda_version: "12.2"
  required_tensorrt_version: "10.0.1"
  required_compute_capability: "8.7"
