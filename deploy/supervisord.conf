; supervisord.conf — RepoScan Pro multi-process supervisor configuration
;
; Used for local workstation development and non-systemd Linux deployments.
; For Jetson Orin field deployments use the systemd units in deploy/systemd/.
;
; Usage:
;   supervisord -c deploy/supervisord.conf
;   supervisorctl -c deploy/supervisord.conf status
;   supervisorctl -c deploy/supervisord.conf restart reposcan-api
;
; Requires the Python virtualenv to be active and npm build to be complete.
; Set REPOSCAN_DEPLOY_PROFILE to override the deployment config used.

[unix_http_server]
file=/tmp/reposcan-supervisor.sock
chmod=0700

[supervisord]
logfile=logs/supervisord.log
logfile_maxbytes=20MB
logfile_backups=5
loglevel=info
pidfile=runtime/supervisord.pid
nodaemon=false
user=%(ENV_USER)s

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/reposcan-supervisor.sock

; ─── API server ────────────────────────────────────────────────────────────────
[program:reposcan-api]
command=uvicorn reposcan_api.main:app
    --host %(ENV_REPOSCAN_API_HOST)s
    --port %(ENV_REPOSCAN_API_PORT)s
    --log-level warning
directory=%(here)s/..
environment=REPOSCAN_DEPLOY_PROFILE="%(ENV_REPOSCAN_DEPLOY_PROFILE)s"
autostart=true
autorestart=true
startretries=5
startsecs=3
stopwaitsecs=10
stdout_logfile=logs/api.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stderr_logfile=logs/api-err.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=3
priority=100

; ─── Headless ingest runtime ───────────────────────────────────────────────────
; Replace the command below with the live-camera ingest entry point when
; physical cameras are available.  For file-sequence demo use:
;   python scripts/run_file_sequence_demo.py
[program:reposcan-ingest]
command=python scripts/run_file_sequence_demo.py --loop
directory=%(here)s/..
environment=REPOSCAN_DEPLOY_PROFILE="%(ENV_REPOSCAN_DEPLOY_PROFILE)s"
autostart=false
autorestart=true
startretries=3
startsecs=5
stopwaitsecs=15
stdout_logfile=logs/ingest.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stderr_logfile=logs/ingest-err.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=3
priority=200

; ─── UI static server (dev/staging only) ───────────────────────────────────────
; In production, serve the built UI via nginx or a reverse proxy instead.
[program:reposcan-ui]
command=npm run ui:preview
directory=%(here)s/..
autostart=true
autorestart=true
startretries=3
startsecs=5
stopwaitsecs=10
stdout_logfile=logs/ui.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=logs/ui-err.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=2
priority=300

; ─── Process groups ────────────────────────────────────────────────────────────
[group:reposcan-core]
programs=reposcan-api,reposcan-ui
priority=100

[group:reposcan-ingest]
programs=reposcan-ingest
priority=200
